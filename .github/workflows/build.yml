name: Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 🏗️ Build, test and report coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: 📦 Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: 🏗️ Build frontend
        run: npm run build

      - name: 🧪 Run tests with coverage
        run: npm test

      - name: 📊 Coverage summary
        run: |
          set -o pipefail
          node scripts/coverage-report.mjs | tee coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: 💬 Comment coverage on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- coverage-report -->'
          {
            echo "$marker"
            cat coverage-report.md
            echo
            echo "_Commit ${HEAD_SHA::7} · [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
          } > comment.md
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id // empty")
          if [ -n "${existing}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@comment.md > /dev/null
          fi
