name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release run at a time: two quick merges to main must not race each other
# into computing (and tagging) the same version twice.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: 🚀 Build, test and release
    # Only main is released; a manual run from another branch would tag a pre-release version.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GitVersion needs the full history and the existing tags.
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: 📦 Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: 🏗️ Build frontend
        run: npm run build

      - name: 🧪 Run tests with coverage
        run: npm test

      - name: 📊 Coverage summary
        run: |
          set -o pipefail
          node scripts/coverage-report.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: 🔧 Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: 🏷️ Determine version number
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: 🛡️ Check the version is not already released
        id: guard
        env:
          VERSION: v${{ steps.gitversion.outputs.semVer }}
        run: |
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            echo "::warning::Tag ${VERSION} already exists, so there is nothing new to release for this commit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "## Release ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: 🗜️ Package the frontend build
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          (cd frontend/dist && zip -qr "../../frontend-dist-${VERSION}.zip" .)
          ls -l "frontend-dist-${VERSION}.zip"

      - name: 🏷️ Tag main
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: 🚀 Create GitHub release
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.guard.outputs.version }}
          name: ${{ steps.guard.outputs.version }}
          generate_release_notes: true
          files: frontend-dist-${{ steps.guard.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
